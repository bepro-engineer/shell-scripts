#### GLOBAL DIRECTIVES ####

# Where to place auxiliary files
global(workDirectory="/var/lib/rsyslog")
$Umask 0026

# ローカルログのデフォルト出力形式の設定
template(name="LocalFormat" type="string"
    string="%timestamp:::date-rfc3339% %hostname% %syslogfacility-text%.%syslogseverity-text% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n"
)

# デフォルト出力形式でローカルログを作成
module(load="builtin:omfile" Template="LocalFormat")

#### MODULES ####

# journaldでの入力を有効化
module(load="imjournal" UsePid="system" FileCreateMode="0644")

# ログファイルでの入力を有効化（実際のログファイルパスなどは 別ファイルにて定義）
#module(load="imfile")

# RELP形式でのログ入力を有効化
module(load="imrelp")

#### REMOTE RECEIVING RULES ####
input(type="imrelp" port="20514" maxDataSize="10k")

# リモートからの収集ログ出力形式の設定
template(name="RemoteCollectFormat" type="string"
    string="%timestamp:::date-rfc3339% %hostname% %programname%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n"
)

template(name="RemoteSystemLog" type="string"
    string="/mnt/log_storage/dynamic_collect_logs/system.log")

template(name="RemoteSecurityLog" type="string"
    string="/mnt/log_storage/dynamic_collect_logs/security.log")

template(name="RemoteNetworkLog" type="string"
    string="/mnt/log_storage/dynamic_collect_logs/network.log")

template(name="RemoteDatabaseLog" type="string"
    string="/mnt/log_storage/dynamic_collect_logs/database.log")

template(name="RemoteAplLog" type="string"
    string="/mnt/log_storage/dynamic_collect_logs/apl.log")

# ログファイルでの入力の定義は別ファイル定義して以下に配置
include(file="/etc/rsyslog.d/*.conf" mode="optional")

# 収集ログの書き込み（自サーバ以外からのログ）
if $fromhost-ip != '127.0.0.1' then {
    # セキュリティログ およびauditログ
    if ($programname == 'varlog_secure' or $programname == 'varlog_audit') then {
        action(type="omfile"
            dynaFile="RemoteSecurityLog"
            template="RemoteCollectFormat"
            fileCreateMode="0660"
            fileOwner="comusr01"
            fileGroup="comgrp"
        )
    }

    # ネットワークログ（mFW, mLB, squid）
    else if ($programname == 'mFW_log' or $programname == 'mLB_log') then {
        action(type="omfile"
            dynaFile="RemoteNetworkLog"
            template="RemoteCollectFormat"
            fileCreateMode="0660"
            fileOwner="comusr01"
            fileGroup="comgrp"
        )
    }

    # アラートログ（Oracle）
    else if ($msg contains 'local4.') then {
        action(type="omfile"
            dynaFile="RemoteDatabaseLog"
            template="RemoteCollectFormat"
            fileCreateMode="0660"
            fileOwner="comusr01"
            fileGroup="comgrp"
        )
    }

    # Talendログ
    else if ($msg contains 'local5.') then {
        action(type="omfile"
            dynaFile="RemoteAplLog"
            template="RemoteCollectFormat"
            fileCreateMode="0660"
            fileOwner="comusr01"
            fileGroup="comgrp"
        )
    }

    # その他はシステムログ
    else {
        action(type="omfile"
            dynaFile="RemoteSystemLog"
            template="RemoteCollectFormat"
            fileCreateMode="0660"
            fileOwner="comusr01"
            fileGroup="comgrp"
        )
    }

    # 自サーバ以外は転送されてきたものの収集までなので stop する
    stop
}

#### RULES ####
*.info;mail.none;authpriv.none;cron.none        /var/log/messages
authpriv.*                                      /var/log/secure
mail.*                                          -/var/log/maillog
cron.*                                          /var/log/cron
*.emerg                                         :omusrmsg:*
uucp,news.crit                                  /var/log/spooler
local7.*                                        /var/log/boot.log

#### LOCAL RECEIVING RULES ####

# ログ管理サーバローカルの収集ログ出力形式の設定
template(name="LocalCollectFormat" type="string"
    string="%timestamp:::date-rfc3339% %hostname% %!filename_only% %syslogfacility-text%.%syslogseverity-text% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n"
)

# /var/log/messages の収集ログへの出力
if $syslogseverity <= 6 and
    not ($syslogfacility-text == 'mail' or
         $syslogfacility-text == 'authpriv' or
         $syslogfacility-text == 'cron') then {
    set $!filename_only = "varlog_messages";
    action(type="omfile"
        dynaFile="RemoteSystemLog"
        template="LocalCollectFormat"
        fileCreateMode="0660"
        fileOwner="comusr01"
        fileGroup="comgrp"
    )
}

# /var/log/secure の収集ログへの出力
if $syslogfacility-text == 'authpriv' then {
    set $!filename_only = "varlog_secure";
    action(type="omfile"
        dynaFile="RemoteSecurityLog"
        template="LocalCollectFormat"
        fileCreateMode="0660"
        fileOwner="comusr01"
        fileGroup="comgrp"
    )
}

