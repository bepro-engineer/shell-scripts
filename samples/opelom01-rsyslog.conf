# Performance settings
$MainMsgQueueSize 100000
$MainMsgQueueHighWaterMark 80000
$MainMsgQueueLowWaterMark 20000
$MainMsgQueueDiscardMark 98000
$MainMsgQueueWorkerThreads 4
$MainMsgQueueTimeoutShutdown 10