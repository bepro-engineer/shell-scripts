# ============================================================
# 出力先ファイルパスの定義
# ============================================================
template(name="RemoteSquidAccessLog" type="string"
    string="/mnt/log_storage/dynamic_collect_logs/access.log")

template(name="RemoteSquidCacheLog" type="string"
    string="/mnt/log_storage/dynamic_collect_logs/cache.log")

# ============================================================
# 20514ポート受信ログの仕分け・出力設定（受信側）
# ============================================================

# 外部から届いたデータのみを対象にする
if $fromhost-ip != '127.0.0.1' then {

    # ========================================================
    # ① アクセスログの仕分け
    # 送信側のカスタムフォーマットを考慮し、生データ（$rawmsg）全体からキーワードを検索
    # ========================================================
    if $rawmsg contains 'squid_access' then {
        action(type="omfile"
            dynaFile="RemoteSquidAccessLog"
            fileCreateMode="0660"
            fileOwner="comusr01"
            fileGroup="comgrp"
        )
        stop
    }

    # ========================================================
    # ② キャッシュログの仕分け
    # 送信側のカスタムフォーマットを考慮し、生データ（$rawmsg）全体からキーワードを検索
    # ========================================================
    if $rawmsg contains 'squid_cache' then {
        action(type="omfile"
            dynaFile="RemoteSquidCacheLog"
            fileCreateMode="0660"
            fileOwner="comusr01"
            fileGroup="comgrp"
        )
        stop # 仕分け完了したため処理を終了
    }

    # ========================================================
    # ③ 不要なシステムログの破棄
    # 送信側から誤って全転送されてくるSquid以外のログ（sudoやcron等）をここで遮断する
    # ========================================================
    #stop
}