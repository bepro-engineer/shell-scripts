# ============================================================
# 個別ファイル単体での構文エラーを回避するための定義
# ============================================================
module(load="imfile")

template(name="RelpForwardFormat" type="string"
    string="%timestamp:::date-rfc3339% %hostname% %!filename_only% %syslogfacility-text%.%syslogseverity-text% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n"
)

# ============================================================
# Squid ログ吸い上げ＆転送設定（送信側）
# ============================================================

# ============================================================
# ① インプット定義：ログファイルの監視とファシリティ割り当て
# ============================================================
input(type="imfile"
    File="/var/log/squid/access.log"
    Tag="squid_access"
#    StateFile="squid_access"
    Facility="local6"
    Severity="info"
    PersistStateInterval="1"
    reopenOnTruncate="on"
)

input(type="imfile"
    File="/var/log/squid/cache.log"
    Tag="squid_cache"
#    StateFile="squid_cache"
    Facility="local6"
    Severity="info"
    PersistStateInterval="1"
    reopenOnTruncate="on"
)

# ============================================================
# ② 転送処理：ログ管理サーバ（opelom01）の20514ポートへ送る
# ============================================================

# 変数評価のバグを回避するため、確実にキャッチできる startswith 判定に変更
if $syslogtag startswith 'squid_access' then {
    set $!filename_only = "squid_access";

    action(type="omrelp"
        target="opelom01op1"
        port="20514"
        template="RelpForwardFormat"
        queue.filename="fwdmSquidAcc"    # アクセスログ専用のキュー名
        queue.maxdiskspace="1g"
        queue.saveonshutdown="on"
        queue.type="LinkedList"
        action.resumeRetryCount="-1"
    )
    stop # 転送が完了したらこのログの処理を終了（他ログへの混入防止）
}

# 変数評価のバグを回避するため、確実にキャッチできる startswith 判定に変更
if $syslogtag startswith 'squid_cache' then {
    set $!filename_only = "squid_cache";

    action(type="omrelp"
        target="opelom01op1"
        port="20514"
        template="RelpForwardFormat"
        queue.filename="fwdmSquidCch"    # キャッシュログ専用のキュー名
        queue.maxdiskspace="1g"
        queue.saveonshutdown="on"
        queue.type="LinkedList"
        action.resumeRetryCount="-1"
    )
    stop # 転送が完了したらこのログの処理を終了（他ログへの混入防止）
}
